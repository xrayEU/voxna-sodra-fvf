<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inlägg – Voxna Södra Fiskevårdsförening</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:     #1a1a1a;
      --accent:   #3a7a4a;
      --link:     #2a5fa0;
      --text:     #333;
      --light-bg: #f0f0ee;
      --border:   #ccc;
      --white:    #fff;
    }

    body {
      overflow-y: scroll;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      background: var(--light-bg);
      color: var(--text);
    }

    #wrapper {
      max-width: 900px;
      margin: 0 auto;
      background: var(--white);
      box-shadow: 0 0 12px rgba(0,0,0,.15);
    }

    /* HEADER */
    #header {
      display: none;
    }

    /* HERO */
    #hero {
      width: 100vw;
      height: min(454px, 40vh);
      max-height: 40vh;
      overflow: hidden;
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
      position: relative;
    }
    #hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      display: block;
    }
    #hero .fallback {
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #2d5a3d 0%, #4a8a5a 40%, #7ab87a 70%, #a8d4a8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hero .fallback span {
      color: rgba(255,255,255,0.35);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* NAV */
    nav {
      background: #2b2b2b;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
    }
    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
    }
    nav ul li {
      display: flex;
      align-items: center;
    }
    nav ul li + li::before {
      content: "/";
      color: #666;
      padding: 0 4px;
      font-size: 0.85rem;
    }
    nav ul li a {
      display: block;
      padding: 14px 12px;
      color: #bbb;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color .15s;
    }
    nav ul li a:hover { color: #fff; }
    nav ul li a.active {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    nav ul li a.has-dropdown::after {
      content: " ▾";
      font-size: 0.7rem;
    }

    /* CONTENT */
    #content-area {
      display: flex;
      padding: 24px;
      align-items: flex-start;
    }
    #main {
      flex: 1;
      padding-right: 28px;
    }
    #main h2 {
      font-family: 'Merriweather', serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--dark);
    }
    .post {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e8e8e8;
    }
    .post:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .post time {
      display: block;
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 10px;
    }
    .post h3 {
      font-family: 'Merriweather', serif;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--dark);
    }
    .post p {
      line-height: 1.7;
      color: #444;
      margin-bottom: 8px;
    }

    /* SIDEBAR */
    #sidebar {
      width: 190px;
      flex-shrink: 0;
      font-size: 0.88rem;
    }
    .sidebar-section { margin-bottom: 20px; }
    .sidebar-section h3 {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
    }
    .sidebar-section p {
      line-height: 1.6;
      color: #555;
      font-size: 0.85rem;
    }
    .sidebar-section a {
      display: block;
      color: var(--link);
      text-decoration: none;
      padding: 2px 0;
    }
    .sidebar-section a:hover { text-decoration: underline; }
    .sidebar-section a::before { content: "• "; color: var(--accent); }

    /* FOOTER */
    #footer {
      border-top: 2px solid var(--dark);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #555;
    }

    @media (max-width: 600px) {
      #content-area { flex-direction: column; padding: 16px; }
      #main { padding-right: 0; margin-bottom: 20px; }
      #sidebar { width: 100%; }
    }
  </style>
</head>
<body>

<div id="wrapper">
  <div id="header">
    <div class="header-top">
      <h1>Voxna Södra Fiskevårdsförening</h1>
    </div>
  </div>
  <div id="hero">
    <img src="bilder/hero.png" alt="Voxna Södra Fiskevårdsförening" />
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Hem</a></li>
      <li><a href="inlagg.html" class="active">Inlägg</a></li>
      <li><a href="regler.html">Regler</a></li>
      <li><a href="fiskekort.html">Fiskekort</a></li>
      <li><a href="karta.html">Karta</a></li>
    </ul>
  </nav>

  <div id="content-area">
    <div id="main">
      <h2>Senaste nyheter</h2>
      <div id="news-posts">
        <p>Laddar nyheter…</p>
      </div>
    </div>

    <div id="sidebar">
      <div class="sidebar-section">
        <h3>Senaste inläggen</h3>
        <div id="recent-links"></div>
      </div>
    </div>
  </div>

  <div id="footer">
    <span>Voxna Södra Fiskevårdsförening</span>
  </div>
</div>

<script>
  const storageKey = 'voxnaNewsPosts';
  const newsPosts = document.getElementById('news-posts');
  const recentLinks = document.getElementById('recent-links');

  const defaultPosts = [
    { id: 'default-1', date: '2026-05-01', title: 'Ny fiskerestriktion vid Finnstugaströmmen', content: 'Från och med nästa månad måste all fisk i Finnstugaströmmen återutsättas. Detta är ett viktigt steg för att skydda beståndet av öring och harr i området. Vi uppmanar alla medlemmar att kontrollera sina fiskekort och följa de nya reglerna för att undvika böter.' },
    { id: 'default-2', date: '2026-04-15', title: 'Vårstäddagen vid Voxnaån', content: 'Vårens städdag blir lördagen den 20 april. Vi samlas klockan 10:00 vid Voxna Livs för en gemensam insats längs med ån. Medlemmar som hjälper till bjuds på kaffe och smörgås. Ta gärna med handskar och vadarbyxor.' },
    { id: 'default-3', date: '2026-03-30', title: 'Ny återförsäljare för fiskekort', content: 'Voxnabruks Kanot & Camping säljer nu fiskekort i butiken. Det ger fler möjligheter för besökare att köpa kort på plats. Swish-numret för direktköp är fortfarande 1231280221, men nu finns också fysisk försäljning under butikens öppettider.' }
  ];

  function formatSwedishDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('sv-SE', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function getMonthYear(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('sv-SE', { year: 'numeric', month: 'long' });
  }

  function createPostElement(post) {
    const article = document.createElement('article');
    article.className = 'post';
    article.id = `post-${post.id}`;

    const timeEl = document.createElement('time');
    timeEl.dateTime = post.date;
    timeEl.textContent = formatSwedishDate(post.date);
    article.appendChild(timeEl);

    const title = document.createElement('h3');
    title.textContent = post.title;
    article.appendChild(title);

    const paragraph = document.createElement('p');
    paragraph.textContent = post.content;
    article.appendChild(paragraph);

    return article;
  }

  function loadSavedPosts() {
    const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const posts = stored.length ? stored : defaultPosts;
    if (!stored.length) {
      localStorage.setItem(storageKey, JSON.stringify(posts));
    }

    newsPosts.innerHTML = '';
    recentLinks.innerHTML = '';

    const sortedPosts = posts.slice().reverse();
    const recentPosts = sortedPosts.slice(0, 5);

    recentPosts.forEach(post => {
      newsPosts.appendChild(createPostElement(post));
      const link = document.createElement('a');
      link.href = `#post-${post.id}`;
      link.textContent = post.title;
      recentLinks.appendChild(link);
    });
  }

  document.addEventListener('DOMContentLoaded', loadSavedPosts);
</script>
</body>
</html>
