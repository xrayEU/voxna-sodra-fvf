<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inlägg – Voxna Södra Fiskevårdsförening</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:     #1a1a1a;
      --accent:   #3a7a4a;
      --link:     #2a5fa0;
      --text:     #333;
      --light-bg: #f0f0ee;
      --border:   #ccc;
      --white:    #fff;
    }

    body {
      overflow-y: scroll;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 15px;
      background: var(--light-bg);
      color: var(--text);
    }

    #wrapper {
      max-width: 900px;
      margin: 0 auto;
      background: var(--white);
      box-shadow: 0 0 12px rgba(0,0,0,.15);
    }

    #header { display: none; }

    #hero {
      width: 100vw;
      height: min(454px, 40vh);
      max-height: 40vh;
      overflow: hidden;
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
      position: relative;
    }
    #hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      display: block;
    }

    nav {
      background: #2b2b2b;
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      margin-right: calc(-50vw + 50%);
    }
    nav ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 0 16px;
    }
    nav ul li { display: flex; align-items: center; }
    nav ul li + li::before { content: "/"; color: #666; padding: 0 4px; font-size: 0.85rem; }
    nav ul li a {
      display: block;
      padding: 14px 12px;
      color: #bbb;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color .15s;
    }
    nav ul li a:hover { color: #fff; }
    nav ul li a.active { color: #fff; text-decoration: underline; text-underline-offset: 3px; }

    #content-area {
      padding: 24px;
    }

    #main h2 {
      font-family: 'Merriweather', serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--dark);
    }

    /* ACCORDION */
    .year-group {
      margin-bottom: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    .year-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--dark);
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .year-header:hover { background: #2e2e2e; }
    .year-header.open { background: var(--accent); }

    .year-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .year-label {
      font-family: 'Merriweather', serif;
      font-size: 1rem;
      font-weight: 700;
    }

    .year-count {
      font-size: 0.78rem;
      background: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 20px;
    }

    .year-arrow {
      font-size: 0.8rem;
      transition: transform 0.2s;
    }
    .year-header.open .year-arrow {
      transform: rotate(180deg);
    }

    .year-posts {
      display: none;
      background: var(--white);
    }
    .year-posts.open {
      display: block;
    }

    /* POSTS */
    .post {
      padding: 18px 20px;
      border-bottom: 1px solid #f0f0f0;
    }
    .post:last-child { border-bottom: none; }

    .post time {
      display: block;
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 5px;
    }
    .post h3 {
      font-family: 'Merriweather', serif;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--dark);
    }
    .post-preview { line-height: 1.7; color: #555; font-size: 0.92rem; margin-bottom: 8px; }
    .post-full { display: none; line-height: 1.7; color: #444; font-size: 0.92rem; }
    .post-full p { margin-bottom: 8px; }

    .read-more-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .read-more-btn:hover { color: #2a5a35; }

    .loading { color: #777; font-style: italic; padding: 20px 0; }
    .error { color: #a00; font-size: 0.9rem; }

    #footer {
      border-top: 2px solid var(--dark);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #555;
    }

    @media (max-width: 600px) {
      #content-area { padding: 16px; }
    }
  </style>
  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e07b622263724bc68c6dd825b6246d8f"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>
<body>

<div id="wrapper">
  <div id="header">
    <div class="header-top">
      <h1>Voxna Södra Fiskevårdsförening</h1>
    </div>
  </div>
  <div id="hero">
    <img src="bilder/hero.png" alt="Voxna Södra Fiskevårdsförening" />
  </div>

  <nav>
    <ul>
      <li><a href="index.html">Hem</a></li>
      <li><a href="inlagg.html" class="active">Inlägg</a></li>
      <li><a href="regler.html">Regler</a></li>
      <li><a href="fiskekort.html">Fiskekort</a></li>
      <li><a href="karta.html">Karta</a></li>
    </ul>
  </nav>

  <div id="content-area">
    <div id="main">
      <h2>Nyheter &amp; inlägg</h2>
      <div id="news-posts">
        <p class="loading">Laddar inlägg…</p>
      </div>
    </div>
  </div>

  <div id="footer">
    <span>Voxna Södra Fiskevårdsförening</span>
  </div>
</div>

<script>
  const GITHUB_USER = 'xrayEU';
  const GITHUB_REPO = 'voxna-sodra-fvf';
  const POSTS_PATH = 'inlagg';
  const PREVIEW_LENGTH = 150;

  function formatSwedishDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('sv-SE', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function parseFrontmatter(text) {
    const match = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    if (!match) return null;
    const meta = {};
    match[1].split('\n').forEach(line => {
      const [key, ...val] = line.split(':');
      if (key) meta[key.trim()] = val.join(':').trim().replace(/^"|"$/g, '');
    });
    meta.body = match[2].trim();
    return meta;
  }

  function simpleMarkdown(text) {
    return text
      .replace(/^### (.+)$/gm, '<h4>$1</h4>')
      .replace(/^## (.+)$/gm, '<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^/, '<p>')
      .replace(/$/, '</p>');
  }

  function getPreview(text) {
    const plain = text
      .replace(/^#+\s/gm, '')
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/\*(.+?)\*/g, '$1')
      .replace(/\n+/g, ' ')
      .trim();
    if (plain.length <= PREVIEW_LENGTH) return plain;
    return plain.substring(0, PREVIEW_LENGTH).replace(/\s+\S*$/, '') + '…';
  }

  function togglePost(id) {
    const preview = document.getElementById('preview-' + id);
    const full = document.getElementById('full-' + id);
    const btn = document.getElementById('btn-' + id);
    const isExpanded = full.style.display === 'block';
    full.style.display = isExpanded ? 'none' : 'block';
    preview.style.display = isExpanded ? 'block' : 'none';
    btn.textContent = isExpanded ? 'Läs mer' : 'Visa mindre';
  }

  function toggleYear(year) {
    const posts = document.getElementById('year-posts-' + year);
    const header = document.getElementById('year-header-' + year);
    const isOpen = posts.classList.contains('open');
    posts.classList.toggle('open', !isOpen);
    header.classList.toggle('open', !isOpen);
  }

  async function loadPosts() {
    const container = document.getElementById('news-posts');

    try {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_PATH}`;
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error('Kunde inte hämta inlägg');
      const files = await res.json();

      const posts = await Promise.all(
        files
          .filter(f => f.name.endsWith('.md'))
          .map(async f => {
            const fileRes = await fetch(f.download_url);
            const text = await fileRes.text();
            return { ...parseFrontmatter(text), slug: f.name };
          })
      );

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (posts.length === 0) {
        container.innerHTML = '<p>Inga inlägg ännu.</p>';
        return;
      }

      // Gruppera per år
      const byYear = {};
      posts.forEach((post, i) => {
        const year = post.date ? post.date.substring(0, 4) : 'Okänt';
        if (!byYear[year]) byYear[year] = [];
        byYear[year].push({ ...post, index: i });
      });

      container.innerHTML = '';
      const years = Object.keys(byYear).sort((a, b) => b - a);

      years.forEach((year, yi) => {
        const group = document.createElement('div');
        group.className = 'year-group';

        const postsHtml = byYear[year].map(post => {
          const i = post.index;
          const preview = getPreview(post.body);
          const fullHtml = simpleMarkdown(post.body);
          const hasMore = post.body.replace(/\s+/g, ' ').trim().length > PREVIEW_LENGTH;
          return `
            <div class="post">
              <time datetime="${post.date}">${formatSwedishDate(post.date)}</time>
              <h3>${post.title}</h3>
              <p class="post-preview" id="preview-${i}">${preview}</p>
              <div class="post-full" id="full-${i}">${fullHtml}</div>
              ${hasMore ? `<button class="read-more-btn" id="btn-${i}" onclick="togglePost(${i})">Läs mer</button>` : ''}
            </div>
          `;
        }).join('');

        const isCurrentYear = yi === 0;

        group.innerHTML = `
          <div class="year-header ${isCurrentYear ? 'open' : ''}" id="year-header-${year}" onclick="toggleYear('${year}')">
            <div class="year-header-left">
              <span class="year-label">${year}</span>
              <span class="year-count">${byYear[year].length} inlägg</span>
            </div>
            <span class="year-arrow">▼</span>
          </div>
          <div class="year-posts ${isCurrentYear ? 'open' : ''}" id="year-posts-${year}">
            ${postsHtml}
          </div>
        `;

        container.appendChild(group);
      });

    } catch (err) {
      container.innerHTML = `<p class="error">Kunde inte ladda inlägg. Försök igen senare.</p>`;
      console.error(err);
    }
  }

  document.addEventListener('DOMContentLoaded', loadPosts);
</script>

<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/index.html";
        });
      }
    });
  }
</script>

</body>
</html>
