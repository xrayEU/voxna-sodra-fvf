<!DOCTYPE html>
<html>
<head><meta charset="utf-8"/></head>
<body>
<script>
  if (window.opener) {
    window.opener.postMessage(
      'authorization:github:success:' + JSON.stringify({
        token: new URLSearchParams(window.location.search).get('code')
      }),
      window.location.origin
    );
  }
  window.close();
</script>
</body>
</html>
