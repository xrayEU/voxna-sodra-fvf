backend:
  name: github
  repo: xrayEU/voxna-sodra-fvf
  branch: main
  base_url: https://cms-oauth.xray1337.workers.dev
  auth_endpoint: /

media_folder: bilder
public_folder: /bilder

collections:
  - name: inlagg
    label: Inlägg
    folder: inlagg
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Datum, name: date, widget: datetime }
      - { label: Innehåll, name: body, widget: markdown }